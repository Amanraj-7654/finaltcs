version: '3.8'

services:
  # ── App Database (MySQL) ──────────────────────────────────
  db:
    image: mysql:8.0
    container_name: techcode-db
    environment:
      MYSQL_ROOT_PASSWORD: Aman#098
      MYSQL_DATABASE: stud
      MYSQL_PASSWORD: Aman#098
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  # ── Backend (Spring Boot) ─────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: techcode-backend
    ports:
      - "8082:8082"
    environment:
      - DB_URL=jdbc:mysql://db:3306/stud
      - DB_USERNAME=root
      - DB_PASSWORD=Aman#098
      - SERVER_PORT=8082
      - JWT_SECRET=YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVmMDEyMzQ1Njc4OQ==
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost
      - JUDGE0_API_URL=http://judge0-server:2358
    depends_on:
      - db
      - judge0-server
    restart: unless-stopped

  # ── Frontend (React/Vite) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8082/api
    container_name: techcode-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Judge0 Database (Postgres) ────────────────────────────
  judge0-db:
    image: postgres:13.0
    container_name: judge0-db
    env_file: judge0.conf
    volumes:
      - judge0-db-data:/var/lib/postgresql/data/
    restart: always

  # ── Judge0 Redis ──────────────────────────────────────────
  judge0-redis:
    image: redis:6.0
    container_name: judge0-redis
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    volumes:
      - judge0-redis-data:/data
    restart: always

  # ── Judge0 Server ─────────────────────────────────────────
  judge0-server:
    image: judge0/judge0:1.13.0
    container_name: judge0-server
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    restart: always
    depends_on:
      - judge0-db
      - judge0-redis

  # ── Judge0 Workers ────────────────────────────────────────
  judge0-workers:
    image: judge0/judge0:1.13.0
    container_name: judge0-workers
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: always
    depends_on:
      - judge0-db
      - judge0-redis

volumes:
  db_data:
  judge0-db-data:
  judge0-redis-data:
